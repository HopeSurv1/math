<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學小老師</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=15">
</head>
<body>

    <div class="auth-screen" id="authScreen" hidden>
        <div class="auth-card">
            <div class="brand-mark" aria-hidden="true">π</div>
            <h1 class="auth-title"><span class="gradient-text">數學小老師</span></h1>
            <p class="auth-desc">登入後就能開始問問題，你的對話會被記住，下次回來還接得上。</p>

            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab active" data-tab="login">登入</button>
                <button type="button" class="auth-tab" data-tab="register">註冊新帳號</button>
            </div>

            <form id="loginForm" class="auth-form">
                <input type="text" id="loginUsername" placeholder="帳號" autocomplete="username" required>
                <input type="password" id="loginPassword" placeholder="密碼" autocomplete="current-password" required>
                <button type="submit" class="btn-primary auth-submit">登入</button>
                <p class="auth-msg" id="loginMsg"></p>
            </form>

            <form id="registerForm" class="auth-form" hidden>
                <input type="text" id="registerUsername" placeholder="設定帳號" autocomplete="username" required>
                <input type="password" id="registerPassword" placeholder="設定密碼" autocomplete="new-password" required>
                <button type="submit" class="btn-primary auth-submit">建立帳號</button>
                <p class="auth-msg" id="registerMsg"></p>
            </form>
        </div>
    </div>

    <div class="app-container" id="appContainer" hidden>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button id="sidebarToggleBtn" class="icon-btn" type="button" title="收合／展開選單" aria-label="收合／展開選單">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>

            <button id="newChatBtn" class="new-chat-btn" type="button" title="發起新對話">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                <span class="sidebar-label">發起新對話</span>
            </button>

            <a href="/learning" class="sidebar-link" title="我的學習紀錄">
                <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>
                <span class="sidebar-label">學習紀錄</span>
            </a>

            <div class="history-panel">
                <h3 class="history-heading">近期對話</h3>
                <div class="history-list" id="historyList">

                </div>
            </div>

            <div class="sidebar-bottom">
                <button id="accountBtn" class="user-chip" type="button" title="帳號設定">
                    <span class="user-avatar" id="userAvatar">?</span>
                    <span id="currentUsername" class="current-username sidebar-label"></span>
                </button>
                <button id="logoutBtn" class="icon-btn logout-btn" type="button" title="登出" aria-label="登出">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                </button>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <main class="chat-section">
            <header class="chat-header">
                <button id="mobileMenuBtn" class="icon-btn mobile-only" type="button" aria-label="開啟選單">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <span class="app-name"><span class="logo-mark" aria-hidden="true">π</span>數學小老師</span>
            </header>

            <div class="chat-history" id="chatHistory">

            </div>

            <div class="input-area">
                <div class="composer">
                    <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
                        <img id="imagePreview" src="" alt="預覽圖片">
                        <button id="removeImageBtn" class="remove-image-btn" type="button" title="移除圖片" aria-label="移除圖片">
                            <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
                        </button>
                    </div>

                    <div id="mathKeyboard" class="math-keyboard">
                        <button class="math-key" type="button" data-symbol="+">+</button>
                        <button class="math-key" type="button" data-symbol="-">−</button>
                        <button class="math-key" type="button" data-symbol="×">×</button>
                        <button class="math-key" type="button" data-symbol="÷">÷</button>
                        <button class="math-key" type="button" data-symbol="=">=</button>
                        <button id="powerModeBtn" class="math-key" type="button" title="切換次方模式">xⁿ</button>
                        <button class="math-key" type="button" data-symbol="()">( )</button>
                        <button class="math-key" type="button" data-symbol="√">√</button>
                        <button class="math-key" type="button" data-symbol="π">π</button>
                        <button class="math-key" type="button" data-symbol="θ">θ</button>
                        <button class="math-key" type="button" data-symbol="∠">∠</button>
                        <button class="math-key" type="button" data-symbol="△">△</button>
                    </div>

                    <input type="text" id="userInput" placeholder="問問數學小老師" autocomplete="off">

                    <div class="composer-actions">
                        <div class="composer-left">
                            <label for="imageUpload" class="icon-btn upload-btn" title="上傳圖片">
                                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
                                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                            </label>
                            <button id="toggleKeyboardBtn" class="tool-chip" type="button" title="數學符號">
                                <span class="tool-chip-symbol">∑</span>
                                <span>數學符號</span>
                            </button>
                        </div>
                        <div class="composer-right">
                            <button id="voiceLangBtn" class="voice-lang-badge" title="切換語音語言 (中 / EN)" type="button">中</button>
                            <button id="voiceInputBtn" class="icon-btn" title="語音輸入" type="button" aria-label="語音輸入">
                                <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/></svg>
                            </button>

                            <button id="sendBtn" class="send-btn" type="button" title="傳送" aria-label="傳送">
                                <svg class="icon-send" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                                <svg class="icon-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
                <p class="disclaimer">數學小老師也可能出錯，重要的答案請再和課本或老師確認。</p>
            </div>
        </main>
    </div>

    <dialog id="accountDialog" class="dialog" aria-labelledby="accountDialogTitle">
        <form id="deleteAccountForm" class="dialog-body">
            <h2 class="dialog-title" id="accountDialogTitle">帳號設定</h2>
            <div class="dialog-account">
                <span class="user-avatar" id="accountDialogAvatar">?</span>
                <span id="accountDialogName"></span>
            </div>

            <section class="danger-zone">
                <h3>刪除帳號</h3>
                <p>這個帳號的所有對話紀錄和老師畫的圖都會一起永久刪除，無法復原。</p>
                <label for="deleteAccountPassword">輸入密碼確認</label>
                <input type="password" id="deleteAccountPassword" autocomplete="current-password" required>
                <p class="auth-msg" id="deleteAccountMsg"></p>
            </section>

            <div class="dialog-actions">
                <button type="button" class="btn-secondary" id="closeAccountDialogBtn">取消</button>
                <button type="submit" class="btn-danger" id="confirmDeleteAccountBtn">永久刪除帳號</button>
            </div>
        </form>
    </dialog>

    <script src="speech_math.js?v=2"></script>
    <script src="app.js?v=18"></script>
</body>
</html>
