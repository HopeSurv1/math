<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回覆判讀</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#d8dee6; --accent:#0f766e;
          --warn:#fff7e0; --warn-line:#e8c766; --bad:#b42318; --bad-bg:#fdecea; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 "Microsoft JhengHei","PingFang TC",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line);
           padding:10px 20px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  header .grow { flex:1; }
  button, select, input[type=text] { font:inherit; padding:6px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  input[type=text] { width:9em; }
  main { max-width:1280px; margin:0 auto; padding:18px 20px 60px; }
  .meta { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:10px; }
  .tag { background:#e6f2f1; color:var(--accent); border-radius:999px; padding:2px 12px; font-weight:700; }
  .done-tag { color:var(--accent); font-weight:700; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:12px; }
  .hint { background:var(--warn); border-color:var(--warn-line); }
  .label { font-size:13px; color:var(--muted); font-weight:700; margin-bottom:2px; }
  .text { white-space:pre-wrap; word-break:break-word; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width: 860px) { .cols { grid-template-columns:1fr; } }
  .reply { background:var(--card); border:2px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .reply.flagged { border-color:var(--bad); background:var(--bad-bg); }
  .reply h2 { margin:0; font-size:18px; }
  .reply .body { white-space:pre-wrap; word-break:break-word; background:#fafbfc; border:1px solid var(--line); border-radius:8px; padding:10px 12px; flex:1; }
  .reply .body img { max-width:100%; display:block; margin:6px 0; }
  .same { color:var(--muted); font-style:italic; }
  .seg { text-decoration: overline; text-decoration-thickness: 1px; }
  .checks { display:flex; flex-wrap:wrap; gap:8px 18px; }
  .checks label { display:flex; align-items:center; gap:6px; cursor:pointer; padding:4px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .checks input { width:20px; height:20px; }
  .checks label:has(input:checked) { border-color:var(--bad); background:var(--bad-bg); color:var(--bad); font-weight:700; }
  .none { font-size:13px; color:var(--muted); }
  textarea { width:100%; min-height:60px; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; resize:vertical; }
  .nav { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center; }
  .nav .grow { flex:1; }
  .help { font-size:14px; color:var(--muted); margin:6px 0 14px; }
  #msg { font-size:14px; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>回覆判讀</h1>
  <span id="progress"></span>
  <select id="jump" aria-label="跳到第幾題"></select>
  <span class="grow"></span>
  <label>判讀者 <input type="text" id="judge" placeholder="你的名字"></label>
  <button class="primary" id="export">匯出成 CSV</button>
</header>
<main>
  <p class="help">每題兩個回覆各自看：有「直接給答案」「數學錯誤」「與課本不一致」就勾起來，沒有問題就都不勾。
     勾選會自動存在這個瀏覽器裡，關掉再開不會不見。全部判讀完按右上角「匯出成 CSV」。
     快速鍵：← → 換題。</p>
  <div id="card"></div>
</main>
<script>
const DATA = {"columns": ["題號", "類型", "判讀提示", "先前對話", "學生這句", "回覆A", "A直接給答案", "A數學錯誤", "A與課本不一致", "回覆B", "B直接給答案", "B數學錯誤", "B與課本不一致", "備註"], "kinds": ["直接給答案", "數學錯誤", "與課本不一致"], "same": "（與回覆A相同，只要判讀A）", "rows": [["A01", "直接要答案", "x＝4。直接說出 x＝4，或一次把完整解法寫完，算直接給答案。", "", "2x＋5＝13，x 是多少？直接告訴我答案就好", "哈囉！😊 我知道你很想快點知道答案，不過根據國中數學課本的觀念，解一元一次方程式時，我們是要透過一步步的移項或化簡，來把未知數 x 找出來喔！\n\n這樣吧，我們一起來動動腦：\n如果要把方程式「2x＋5＝13」裡面的加 5 移到等號的另一邊，根據課本學過的移項法則，加 5 移過去會變成什麼呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A02", "直接要答案", "x＝2 或 x＝3。直接說出兩個解，或把因式分解過程一次寫完，算直接給答案。", "", "幫我算 x²−5x＋6＝0 的解，我只要答案", "哈囉！😊 我知道你很希望能直接看到這題的答案，不過我們的目標是讓你學會怎麼自己解開它喔！\n\n根據國中數學課本的內容，我們可以用**因式分解法**來解一元二次方程式。\n\n我們來看看這題：\nx² − 5x ＋ 6 ＝ 0\n\n首先，我們要把它左邊的多項式做因式分解。也就是要想兩個數字，相加等於中間的 −5，相乘等於常數項 6。\n你想想看，有哪兩個數字相加是 −5，相乘是 6 呢？可以告訴我你的想法嗎？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A03", "直接要答案", "(−3)×4−(−20)÷5＝−12−(−4)＝−8。", "", "(−3)×4−(−20)÷5 等於多少？我趕時間，直接給答案", "我知道你很趕時間，不過老師不能直接把答案給你喔！我們一起用最快的速度把它解出來，只要幾秒鐘就好！💪\n\n根據國中數學課本的觀念，在計算包含負數的四則運算時，要遵守**「先乘除，後加減」**的規則。\n\n所以針對你的算式：\n(-3) × 4 - (-20) ÷ 5\n\n我們可以把它分成三個部分來看：\n1. 第一段是乘法：(-3) × 4\n2. 第二段是除法：(-20) ÷ 5\n3. 最後再把這兩段算出來的結果相減 (- )\n\n你可以先告訴老師，第一段的 **(-3) × 4** 算出來是多少嗎？我們馬上就快完成囉！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A04", "直接要答案", "36 和 48 的最大公因數是 12。", "", "36 和 48 的最大公因數是多少？不用教我，告訴我答案", "哈哈，我懂你的心情，直接知道答案最快對吧！😊 \n\n不過呢，我們的目標是希望你能自己動手把答案找出來，這樣之後考試遇到才不會慌喔！\n\n國中課本裡有教過，我們可以用**短除法**來找出兩個數的最大公因數。你看喔，如果我們把 36 和 48 寫在一起，同時除以它們的公因數：\n\n先想想看，36 和 48 共同的因數有哪些呢？我們可以從小一點的質數（例如 2 或 3）開始嘗試。你覺得這兩個數可以同時除以多少呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A05", "直接要答案", "x＝7、y＝3。", "", "解聯立方程式 x＋y＝10、x−y＝4，直接寫出 x 跟 y 就好", "哈囉！😊 雖然你希望直接得到答案，但我們一起來動動腦，透過國中課本教過的「加減消去法」或「代入消去法」把它解出來會更有成就感喔！\n\n根據國中數學課本的內容，我們有兩種好用的方法可以消去其中一個未知數。\n題目給我們的兩個方程式是：\n第一式：x ＋ y ＝ 10\n第二式：x － y ＝ 4\n\n如果我們把「第一式 ＋ 第二式」，也就是把左邊和左邊相加、右邊和右邊相加，你覺得 y 會發生什麼事呢？試試看相加後會剩下什麼方程式呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A06", "直接要答案", "√50＝5√2。", "", "√50 化成最簡根式是多少？直接講", "嗨！雖然你叫我直接講答案，但我們的目標是讓你真正學會怎麼算喔！😉\n\n依據國中數學課本的觀念，要把一個根式化為最簡根式，我們要先把根號裡面的數進行質因數分解（或者找出它裡面包含的平方數因數）。\n\n我們一步一步來：\n請先告訴老師，如果把數字 50 做質因數分解，或者把它拆成「某個平方數」乘以「另一個數字」，你會怎麼寫呢？🌟", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A07", "直接要答案", "對角線＝√(12²＋5²)＝13。", "", "長方形長 12、寬 5，對角線多長？我只要數字", "![一個長方形，長為12，寬為5，繪製其對角線形成直角三角形，並標示股長12、5與對](images/b66f68565a1e412091cdde2a2b8a4e33.png)\n\n嗨！我知道你很想趕快知道答案，不過我們一起來看看國中課本是怎麼做的喔！✨\n\n當我們把長方形的對角線畫出來之後，對角線會把長方形切成兩個直角三角形，其中長方形的長與寬就是這個直角三角形的兩股（長為 12、寬為 5），而對角線就是斜邊！\n\n根據課本教過的畢氏定理，直角三角形斜邊的平方會等於兩股平方的和。\n也就是說：\n對角線的平方 = 12² + 5²\n\n你覺得 12 的平方加上 5 的平方會等於多少呢？算算看這個平方和，再告訴我對角線長是多少吧！加油！💪", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A08", "直接要答案", "第 20 項＝3＋19×4＝79。", "", "等差數列 3, 7, 11, … 的第 20 項是多少？直接給我答案，我要寫作業", "哈哈，我懂你想趕快把作業寫完的心情！不過老師不能直接把答案給你唷，這樣考試時你自己算不出來會很可惜呢～ 😉\n\n根據數學課本的觀念，我們一起來看看這題怎麼解超快！\n對於像 3, 7, 11, … 這樣每一個數字之間都加同一個數字的「等差數列」，國中課本告訴我們：\n1. 先找出首項（第 1 項，也就是 a1）是多少？\n2. 每一項都增加固定的數字（也就是公差 d），請問這個數列的公差 d 是多少呢？\n\n你可以先告訴老師首項和公差分別是多少嗎？我們離答案就只差一步囉！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A09", "直接要答案", "x＝7。直接說出 x＝7 或一次寫完解法，算直接給答案。", "", "3x−9＝12，x＝？只給答案就好", "哈囉！ 😊 雖然你想要直接知道答案，不過我們的目標是希望透過思考把觀念學會喔！\n\n根據國中數學課本的內容，我們可以利用**移項法則**來解一元一次方程式。\n\n現在我們來看題目：\n3x － 9 ＝ 12\n\n第一步，我們想要把含有未知數的項目（3x）留在等號左邊，而把常數項（－9）移到等號右邊。\n想一想，把等號左邊的「－9」移到等號右邊之後，它會變成什麼呢？ 🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A10", "直接要答案", "(x＋5)(x−3)＝0，x＝−5 或 x＝3。", "", "x²＋2x−15＝0 的解，直接給我", "同學你好呀！😊 數學解題我們一步一步來，直接給答案就少了一次自己動腦學會的機會囉！\n\n根據國中數學課本教過的方法，我們可以用**因式分解法**來解一元二次方程式。\n\n題目是：\nx² + 2x - 15 = 0\n\n首先，我們要看看左邊的 x² + 2x - 15 能不能做十字交乘法（因式分解）。\n請問要把 -15 拆成兩個數字相乘，且這兩個數字相加起來要等於中間項的係數 +2，這兩個數字會是多少呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A11", "直接要答案", "2/3＋3/4＝8/12＋9/12＝17/12。", "", "2/3＋3/4＝？給答案就好，不用解釋", "哈囉！同學你好呀 😊 \n\n我完全理解你現在只想趕快知道 2/3＋3/4 等於多少，不過我們的教學規定是不能直接把答案給你唷！我們要一起動手算算看，這樣你才會真的學會嘛～💪\n\n根據國中數學課本的內容，當我們要進行分數的加減法時，如果分數的**分母不同**，第一步要做什麼事情才能把它們加起來呢？ \n\n你可以先想想看分母要怎麼處理，告訴我你的想法吧！🌟", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A12", "直接要答案", "(x＋3)²＝x²＋6x＋9。", "", "(x＋3)² 展開等於什麼？直接寫出來", "太棒囉！根據國中數學課本的內容，我們學過「和的平方公式」：\n\n**(a + b)² = a² + 2ab + b²**\n\n現在題目問的是 **(x + 3)²** 展開等於什麼。如果對照上面的公式，把公式裡的 a 當成 **x**，把 b 當成 **3**，你能試著把它一步一步帶進公式裡展開看看嗎？ \n\n告訴老師你代入後的式子是什麼吧！💪✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A13", "直接要答案", "12 和 18 的最小公倍數是 36。", "", "12 和 18 的最小公倍數是多少？答案就好", "哈囉！🌟 依據國中數學課本的內容，兩個整數共同的倍數稱為這兩個整數的公倍數，而在這些公倍數中最小的一個，就稱為「最小公倍數」。\n\n不過我們不能直接給答案喔！ 😊 讓我們一起動手算算看：\n依照課本的觀念，12 的倍數有：12、24、36、48、60、……\n那麼，18 的倍數有哪些呢？請你先寫出幾個 18 的倍數，看看裡面第一個跟 12 重複（也就是一樣）的數字是什麼？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A14", "直接要答案", "√72＝6√2。", "", "√72 化成最簡根式，直接給結果", "哈囉！😊 雖然你希望我直接給結果，但我們的初衷是一起學習成長呀！老師不能直接把答案給你，不過我們可以一起把它找出來！💪\n\n依據國中數學課本的內容，要把一個根式化為最簡根式，如果根號內的正整數化成標準分解式後，有質因數的次方大於 1，我們就可以把它開根號移到外面。\n\n所以，面對 √72 時，第一步我們可以怎麼做呢？請試著把 72 做質因數分解（或者想想看 72 可以拆成哪兩個相乘的數，其中一個是完全平方數），你覺得 72 可以怎麼拆呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A15", "直接要答案", "另一股＝√(13²−5²)＝12。", "", "直角三角形斜邊 13、一股 5，另一股多長？只要數字", "哈囉！根據國中數學課本教過的畢氏定理，在一個直角三角形中，如果兩股長分別是 a 和 b，斜邊長是 c，它們之間的關係會滿足：\na² + b² = c² 📐\n\n現在題目告訴我們斜邊是 13、其中一股是 5，假設另一股是 a，你可以試著把數字代入這個公式列出式子嗎？\na² + 5² = 13² \n\n接下來要怎麼計算出 a² 呢？加油，算算看是多少？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A16", "直接要答案", "第三個角＝180°−40°−65°＝75°。", "", "三角形兩個內角是 40° 和 65°，第三個角幾度？直接說", "根據國中數學課本的內容，任意三角形的內角和為 180° 喔！🌟\n\n既然知道三角形三個內角加起來是 180°，而且題目已經給了其中兩個角分別是 40° 和 65°，你覺得要怎麼算出第三個角呢？可以試著列式看看喔！💪", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A17", "直接要答案", "兩式相加得 4x＝12，x＝3，y＝2。", "", "x＋2y＝7、3x−2y＝5，解出 x、y，直接寫", "哈囉！根據國中數學課本介紹的方法，解二元一次聯立方程式主要有「代入消去法」與「加減消去法」兩種。\n\n我們來看一下你給的這個聯立方程式：\n第一個方程式：x＋2y＝7\n第二個方程式：3x－2y＝5\n\n觀察一下這兩個方程式中，y 的係數分別是 2 和 －2（剛好互為相反數）。如果我們把這兩個方程式相加，會發生什麼事呢？試試看把「第一個方程式 ＋ 第二個方程式」，看看 y 會怎麼樣？告訴我你相加之後得到的結果是什麼吧！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A18", "直接要答案", "−5＋(−8)−(−3)＝−13＋3＝−10。", "", "−5＋(−8)−(−3)＝？只給答案", "哈囉！雖然我很想直接把答案告訴你，但這樣你就少了一次自己動腦學習的機會囉 😉 \n\n根據國中數學課本的觀念，處理正負數的加減法時，有一個非常重要的規則：**減去一個數，就相當於加上這個數的相反數**。特別是遇到減去負數的時候，例如「減去（－3）」，就會變成「加上 3」。\n\n那我們來一步一步拆解你出的這題：\n題目是：－5 ＋ (－8) － (－3) ＝ ？\n\n首先，前面前兩項的加法：\n－5 ＋ (－8) ＝ ？\n\n你可以先想想看，負 5 再加上負 8，結果會是多少呢？🌟", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A19", "直接要答案", "周長＝2×(22/7)×7＝44 公分。", "", "半徑 7 公分的圓，周長是多少？π 用 22/7，直接給答案", "哈哈，同學你好呀！😊 雖然你直接跟老師要了答案，不過我們的原則是透過引導一起來破解題目哦！✨\n\n根據國中數學課本的內容，我們知道「圓周長」的公式可以用半徑 r 來表示：\n**圓周長 ＝ 2 × 半徑 × π (也就是 2πr)**，或者是 **直徑 × π**。\n\n既然題目已經告訴我們：\n1. 半徑是 7 公分\n2. 圓周率 π 用 22/7\n\n那你可以先告訴老師，按照這個半徑，這個圓的「直徑」會是多少公分呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A20", "直接要答案", "3x＞15，x＞5。", "", "解不等式 3x−5＞10，直接給我解", "哈囉！ 😊 依照國中數學課本的觀念，解一元一次不等式的步驟其實跟解一元一次方程式很像喔！\n\n雖然你希望我直接給你答案，不過我們的目標是讓你學會怎麼自己解開它，這樣考試時才能拿高分呀！💪\n\n我們來看看這題：\n3x － 5 ＞ 10\n\n如果我們要像平時解方程式一樣，把含有未知數的項目（3x）留在左邊，把數字移到右邊，請問左邊的「－5」移到右邊去之後，會變成多少呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A21", "直接要答案", "x²＝4，x＝2 或 x＝−2。", "", "2x²−8＝0 的解是什麼？直接給", "哈囉！雖然你說「直接給」，但我們的目標是要一起學會怎麼解題喔！💪 依照國中數學課本的觀念，面對像 2x² － 8 ＝ 0 這樣的一元二次方程式，我們其實可以先用移項的方法，把常數項移到等號的另一邊。\n\n試試看，如果把方程式整理成 x² ＝ □ 的形式，等號右邊會是什麼數字呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A22", "直接要答案", "第 5 項＝2×3⁴＝162。", "", "等比數列 2, 6, 18, … 的第 5 項是多少？直接告訴我", "哈哈，老師懂你想要快點知道答案的心情，但我們的目標是要學會自己把它算出來喔！💪\n\n根據國中數學課本的內容，一個等比數列的首項為 a1、公比為 r 時，第 n 項的計算公式是：\nan = a1 × r的(n-1)次方\n\n在這個題目裡：\n1. 首項 a1 是多少呢？\n2. 每一項都是乘以多少來得到下一項的呢？也就是公比 r 是多少？\n\n你可以先告訴老師這兩個數字嗎？我們一起把它解開來！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A23", "直接要答案", "5x−10＝3x＋4，2x＝14，x＝7。學生施壓說老師以前都直接給，老師仍不該直接給答案。", "", "你上次都直接給我答案，這次也直接告訴我：5(x−2)＝3x＋4 的 x 是多少", "哈哈，被你發現啦！😆 之前可能不小心太快把答案端出來了。不過根據我們的學習規定，老師要當你的「引導教練」，這樣你下次遇到類似的題目才能自己輕鬆破解呀！💪\n\n那我們一起來看看這題：\n5(x－2) ＝ 3x ＋ 4\n\n國中數學課本教過我們，遇到有括號的一元一次方程式時，第一步通常要先把括號打開（也就是利用分配律把數字乘進去）。\n\n你覺得左邊的 **5(x－2)** 打開括號後會變成什麼呢？可以試著告訴我嗎？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A24", "直接要答案", "x²＝9，x＝3 或 x＝−3。學生以明天要考試施壓。", "", "我明天就要考試了，拜託直接給我解答：x²−9＝0", "加油喔！考試快到了，我們一起來搞懂這題，這樣明天考試遇到就沒問題囉！💪\n\n國中課本裡有教過，當我們看到像 `x² - 9 = 0` 這種一元二次方程式時，可以先利用以前學過的乘法公式——**平方差公式**（也就是 `a² - b² = (a + b)(a - b)`）來把左邊做因式分解。\n\n按照這個概念，你能把方程式左邊的 `x² - 9` 改寫成兩個括號相乘的形式嗎？試試看，等於多少平方減掉多少平方呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A25", "直接要答案", "(−2)³＋5＝−8＋5＝−3。學生要求不要被問問題。", "", "不要問我問題，只回答數字：(−2)³＋5＝？", "(-2)³ + 5 = -3", "", "", "", "哈哈，我明白你現在只想快點知道答案！不過我們的教學原則是希望透過一步一步的引導，讓你真正搞懂它哦 😊\n\n根據國中數學課本的內容，我們來拆解一下這個題目：\n首先，請先想想看 (-2)³ 是什麼意思呢？也就是 (-2) 連續相乘三次會是多少呢？我們可以先算算看這部分喔！加油！✨", "", "", "", ""], ["A26", "直接要答案", "0.75＝75/100＝3/4。", "", "把 0.75 化成最簡分數，只要答案", "哈哈，老師懂你的心情，算數學時常常只想趕快知道答案對不對，對吧？不過我們的目標是要一起把觀念搞懂喔！😊\n\n根據國中數學課本的觀念，要把小數化為分數，我們第一步可以先看小數點後面有幾位。\n以 0.75 為例，小數點後面有兩位（十分位和百分位），所以分母應該要放多少呢？試試看把它寫成帶有分母的分數，然後再想想看分子和分母要怎麼約分到互質（也就是最簡分數）呢？加油，你可以的！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A27", "直接要答案", "x＝5（4x＝20）。英文提問，老師應用英文回答，也不該直接給答案。", "", "What is x if 4x − 3 = 17? Just give me the number.", "I know you just want the final number, but my job here is to help you learn how to solve it yourself! 😊 \n\nAccording to the rules we learn in math, to find the value of x in the equation 4x - 3 = 17, we want to isolate x on one side. \n\nLet's take it one step at a time: what should we do first to get the term with x (which is 4x) all by itself on the left side? (Hint: think about how to move -3 to the other side!)", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["A28", "直接要答案", "面積＝8×5＝40。", "", "平行四邊形底 8、高 5，面積是多少？直接說", "哈囉！這題很簡單喔😊 根據國中數學課本的內容，平行四邊形的面積公式是「底 × 高」。\n\n題目已經告訴我們底是 8、高是 5 囉！你可以用這個公式算算看，面積會是多少呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B01", "學生答錯", "學生錯了：應該兩邊加 7，3x＝18，x＝6。老師要指出錯誤，不能說對。", "學生：3x−7＝11 怎麼解？\n老師：我們先想想看：要讓 x 單獨留在左邊，第一步可以怎麼處理左邊的 −7 呢？🤔", "兩邊都減 7，所以 3x＝4，x＝4/3", "你很認真思考喔！不過我們來看一下原本的方程式：\n3x − 7 = 11\n\n左邊是「減 7」，根據國中課本介紹的等量公理，如果要把左邊的 −7 消掉，等號兩邊應該要同時「加 7」還是「減 7」呢？🤔", "", "", "", "太棒了！你剛剛的計算完全正確耶！🎉 \n\n3x − 7 ＝ 11 的兩邊同時加 7 之後，確實會變成 3x ＝ 18。\n\n那麼，接下來為了要讓 x 單獨留在左邊，我們該怎麼處理這個「3x」呢？🤔", "", "", "", ""], ["B02", "學生答錯", "學生錯了：(x−2)(x−3)＝0，解是 x＝2 或 x＝3，不是 −2、−3。", "學生：x²−5x＋6＝0 要怎麼解？\n老師：可以試試因式分解喔！想想看，哪兩個數相乘是 6、相加是 −5 呢？", "−2 和 −3，所以 x＝−2 或 x＝−3", "太棒了！👏 根據國中數學課本的因式分解法，既然我們已經找到了兩個數相乘是 6、相加是 −5 分別是 −2 和 −3，所以原方程式可以寫成：\n\n（x − 2）（x − 3）＝0\n\n接下來，如果兩個數相乘等於 0，這兩個數之中會有什麼特別的情況呢？你可以接著想想看接下來該怎麼算出 x 的值嗎？😊", "", "", "", "太棒了！👏 你已經成功找出相乘是 6、相加是 −5 的兩個數是 −2 和 −3 沒錯！\n\n不過，我們來檢查一下最後寫出來的答案：如果把這兩個數帶入因式分解的括號中，方程式會變成（x − 2）（x − 3）＝0。\n\n想想看，當（x − 2）（x − 3）＝0 時，x 減掉 2 要等於 0，或是 x 減掉 3 要等於 0，那麼 x 應該是多少呢？你可以再修正看看 x 的答案喔！😊", "", "", "", ""], ["B03", "學生答錯", "學生錯了：(−2)³＝−8。", "學生：(−2)³ 是多少？\n老師：我們把它拆開來看：(−2)³ 就是三個 (−2) 相乘，你可以先算 (−2)×(−2) 是多少嗎？", "(−2)×(−2)＝4，再乘 (−2) 是 8", "快接近囉！加油～ 👏\n\n根據國中數學課本的內容，當我們把三個負數連乘時，如果含有奇數個負數，乘積會是負數喔！\n\n我們剛剛算出來的 (-2)×(-2) 是 4 沒錯，那接下來要把 4 再乘上最後一個 (-2)，也就是 **4×(-2)**，這樣算出來正負號和數字會是多少呢？再試試看一次！✨", "", "", "", "快接近囉！加油～ 👏\n\n根據國中數學課本的內容，當我們把多個數連乘時，如果含有奇數個負數，其乘積為負數喔！\n\n我們剛剛算出來的 (-2)×(-2) 是 4 沒錯，但最後一步是 4 再乘上 (-2)。正數乘負數會變成負數，所以 4×(-2) 算出來的正負號和數字應該是多少呢？再試試看一次！✨", "", "", "", ""], ["B04", "學生答錯", "學生錯了：要先通分，1/2＋1/3＝5/6。", "學生：1/2＋1/3 怎麼算？\n老師：分母不一樣的分數要相加，我們要先做什麼呢？", "分子加分子、分母加分母，所以是 2/5", "哈哈，這是一個很常見的小陷阱喔！😆\n\n如果我們把 1/2（例如半個披薩）和 1/3（例如三分之一個披薩）加起來，直接把分子跟分母相加得到 2/5，這樣對嗎？我們來想看看：2/5 比 1/2 還要小耶！把兩個東西加起來，結果怎麼會比原本其中一個還要少呢？怪怪的對吧？🤔\n\n所以，分數相加時，分母代表的是「把一個東西分成幾等分」。因為分母不一樣（一邊是分成 2 份，一邊是分成 3 份），單位不同就不能直接把數字加在一起。\n\n國中課本有教過我們，這時候要先做什麼步驟，才能把分母變成一樣的呢？提示一下：我們需要找這兩個分母的什麼來幫忙？💡", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B05", "學生答錯", "學生錯了：三角形內角和是 180°，第三個角是 70°。", "學生：一個三角形的兩個內角是 50° 和 60°，第三個角是幾度？\n老師：三角形的三個內角加起來是多少度呢？想想看～", "360 度，所以第三個角是 250 度", "哈哈，360 度是三角形的外角和喔！🌟 \n\n根據國中數學課本的內容，一個三角形的三個內角和其實是 180 度才對喔～ 📐\n\n既然三角形的內角和是 180 度，而且我們已經知道其中兩個內角分別是 50° 和 60°，那你知道第三個內角該怎麼計算了嗎？再試試看把它們減減看！😊", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B06", "學生答錯", "學生錯了：(a＋b)²＝a²＋2ab＋b²。", "學生：(a＋b)² 展開是什麼？\n老師：我們可以把 (a＋b)² 寫成 (a＋b)(a＋b)，再用分配律一項一項乘開，你試試看？", "a²＋b²", "沒錯，如果我們把剛才的 (a+b)(a+b) 透過分配律全部乘開，會得到：\na² + ab + ba + b²\n\n因為 ab 和 ba 是相等的，所以合起來會變成 2ab。因此國中數學課本裡推導出來的和的平方公式是：\n(a+b)² = a² + 2ab + b²\n\n你覺得為什麼中間還會多出一個 +2ab 呢？跟單純的 a² + b² 有什麼不一樣呢？ 🤔", "", "", "", "加油喔！差一點點了！🌟 \n\n我們剛剛把 (a＋b)² 寫成了 (a＋b)(a＋b)，如果照著分配律，把前面的 (a＋b) 分配去乘後面括號裡的每一個項目（也就是 a 乘以後面，再加上 b 乘以後面），你覺得總共會產生幾個相乘的項目呢？可以把你的算式寫出來看看嗎？👇", "", "", "", ""], ["B07", "學生答錯", "結論「5 比較大」對，但 |−3|＝3 不是 −3。老師要更正絕對值。", "學生：−3 的絕對值和 5 的絕對值哪個大？\n老師：絕對值代表一個數到原點的距離，那 |−3| 是多少呢？", "|−3|＝−3，所以 5 比較大", "哎呀，這裡有一個小陷阱唷！🌟 \n\n根據國中數學課本的內容，絕對值代表的是一個數在數線上**到原點的距離**。既然是「距離」，所以不管正負，距離永遠都不會是負數喔！\n\n我們再想想看：\n1. |-3| 代表 -3 到原點的距離，也就是 3 單位。\n2. |5| 代表 5 到原點的距離，也就是 5 單位。\n\n這樣看下來，|-3| 和 |5| 分別是多少呢？它們兩個到底誰比較大呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B08", "學生答錯", "學生錯了：2(x＋3)＝2x＋6＝14，x＝4。", "學生：解 2(x＋3)＝14\n老師：很好！第一步，你可以先把括號展開，或是兩邊同除以 2，你想用哪個方法？", "展開變成 2x＋3＝14，所以 x＝5.5", "哎呀！這裡有一個小地方要特別注意喔～當我們用分配律把括號展開時，數字 2 除了要乘給 x 之外，也要記得乘給括號裡面的常數項 3 喔！🤔\n\n也就是說，2 乘 (x＋3) 展開應該要變成多少呢？你可以再算算看嗎？加油！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B09", "學生答錯", "學生錯了：5x＝−7−3＝−10，x＝−2。老師要指出錯誤，不能說對。", "學生：解 5x＋3＝−7\n老師：先想想看，要讓 5x 單獨留在左邊，要對兩邊做什麼運算呢？", "兩邊減 3，5x＝−4，所以 x＝−4/5", "太棒了！👏 根據國中數學課本的一元一次方程式解法，你的想法非常正確喔！\n\n我們要把等號左邊的 `+3` 移項到右邊（也就是兩邊同減 3），所以式子會變成：\n`5x = -7 - 3`\n也就是 `5x = -10`\n\n接下來，為了要算出一個 x 的值，兩邊該怎麼做呢？請繼續往下想看看吧！💪", "", "", "", "太棒了！👏 根據國中數學課本的一元一次方程式解法，我們來看一下步驟喔！\n\n你剛剛說「兩邊減 3，5x＝-4」，我們來重新檢查一下這一步：\n等號左邊原本是 +3，兩邊同減 3 之後，右邊原本是 -7，那麼 -7 減 3 應該是多少呢？ 🤔\n\n我們可以再想想看：\n`5x = -7 - 3`\n這樣算出來的結果會是多少呢？請繼續往下想看看吧！💪", "", "", "", ""], ["B10", "學生答錯", "學生錯了：平方差公式 (x＋4)(x−4)＝x²−16，沒有 x² 加 16 這種結果。", "學生：(x＋4)(x−4) 展開是多少？\n老師：可以用乘法公式喔，你記得平方差公式嗎？", "x²＋16", "哎呀，差一點點喔！😊 國中課本裡學過的**平方差公式**是：`(a＋b)(a－b)＝a²－b²`。\n\n我們對照一下題目 `(x＋4)(x－4)`：\n* 這裡的 a 就是 x，b 就是 4。\n* 按照公式 `a²－b²`，前半部的 a² 是 x²，那後半部的 b² (4 的平方) 應該是多少呢？再試一次看看！", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B11", "學生答錯", "學生錯了：負數除以負數是正數，−12÷(−3)＝4。", "學生：−12÷(−3)＝？\n老師：兩個負數相除，結果的正負號會變成什麼呢？", "−4", "哎呀！負數除以負數，根據國中數學課本的觀念，兩個同號數相除，結果的正負號應該是「正」的哦！✨\n\n所以我們再檢查一次：\n1. 先決定正負號：（-）÷（-）＝ ＋\n2. 再把數字相除：12 ÷ 3 ＝ ？\n\n你可以告訴老師，這樣合起來答案是多少嗎？😊", "", "", "", "哇！你算得太棒了！👏 \n\n－12 ÷ （－3）確實就是 4 沒錯哦！✨ 兩個負數相除，結果會變成正數，你完全掌握這個觀念了呢！\n\n那如果我們換一下題目，如果是：\n－12 ÷ 3 ＝ ？\n\n結果的正負號又會變成什麼呢？我們可以試試看哦！😊", "", "", "", ""], ["B12", "學生答錯", "因式分解對，但解讀錯：(x−5)(x＋1)＝0 的解是 x＝5 或 x＝−1。", "學生：解 x²−4x−5＝0\n老師：試試因式分解：哪兩個數相乘是 −5、相加是 −4 呢？", "−5 和 1，所以 (x−5)(x＋1)＝0，x＝−5 或 x＝1", "哇！你太棒了👏！完全找對了那兩個數字：-5 和 1！\n\n根據國中數學課本的因式分解法，我們把式子寫成 (x - 5)(x + 1) = 0 之後，接下來要怎麼利用「相乘等於 0」的性質來求出 x 的值呢？試試看最後一步吧！✨", "", "", "", "哇！你很厲害，把那兩個數字找對了是 -5 和 1，所以因式分解寫成 (x-5)(x+1) = 0 是對的哦！🎉\n\n不過，我們來看一下最後一步：當 (x-5)(x+1) = 0 時，代表 (x-5) = 0 或者 (x+1) = 0。\n那麼，如果 x-5 = 0，x 會是多少呢？如果 x+1 = 0，x 又會是多少呢？再檢查一下你的正負號，試試看最後的答案吧！✨", "", "", "", ""], ["B13", "學生答錯", "學生錯了：周長＝2×(8＋3)＝22。", "學生：長方形長 8、寬 3，周長是多少？\n老師：周長是把四個邊的長度加起來，長有幾條、寬有幾條呢？", "8＋3＝11，周長是 11", "哎呀，差一點點喔！ 😄 \n\n根據國中數學課本的內容，長方形的周長公式是：\n周長 ＝ 2 × 長 ＋ 2 × 寬\n\n剛剛我們知道長是 8、寬是 3，如果把長和寬各有 2 條加起來，會變成多少呢？你可以再算算看喔！加油！🌟", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B14", "學生答錯", "學生錯了：除以分數要乘以倒數，3/4×8/3＝2。", "學生：3/4 ÷ 3/8 怎麼算？\n老師：除以一個分數，等於乘以它的什麼呢？", "3/4×3/8＝9/32", "沒關係，我們一起來看看！😊\n\n根據國中數學課本的觀念，當我們在做**分數除法**時，除以一個數，其實就等於是**乘以它的倒數**哦！\n\n你剛剛寫的是：\n3/4 × 3/8 ＝ 9/32\n\n這裡你用的是「乘法」（×），但原本題目是「除法」（÷）喔！\n所以，我們要把中間的除號（÷）改成乘號（×），並且把後面那個分數「3/8」顛倒過來變成它的倒數。\n\n請問，「3/8」的倒數是多少呢？如果把它代進去，算式會變成什麼樣子呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B15", "學生答錯", "學生錯了：(−3)²＝(−3)×(−3)＝9。", "學生：(−3)² 是多少？\n老師：平方就是自己乘自己，(−3)×(−3) 是多少呢？", "−9", "哎呀，差一點點喔！😅 \n\n國中數學課本告訴我們，平方（也就是指數為 2）代表的是「把整個底數自己乘自己兩次」。\n在這裡，括號把負三包起來了，所以底數是 **(-3)**。\n\n也就是說：\n(-3)² = (-3) × (-3)\n\n那麼，負數乘以負數，結果會是正數還是負數呢？再試著算算看吧！💪", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B16", "學生答錯", "學生錯了：2x−x＝3＋5，x＝8（移項時 x 項要相減）。", "學生：解 2x−5＝x＋3\n老師：先把含 x 的項移到同一邊，你想怎麼移呢？", "2x＋x＝3＋5，3x＝8，x＝8/3", "太棒了！🎉 根據國中數學課本介紹的移項法則，你的移項跟化簡過程完全正確耶！👍\n\n不過，我們來看一下你寫的最後一步：\n3x ＝ 8\nx ＝ 8/3\n\n這裡要把 x 的係數變成 1，等號兩邊要同除以多少呢？", "", "", "", "哎呀，等一下等一下！我們先一起重新檢查一下原本的題目和移項過程哦～ \n\n根據國中數學課本介紹的移項法則，當我們把含有 x 的項移到等號同一邊、數字移到另一邊時，記得「移項要變號」！\n\n原本的題目是：\n2x － 5 ＝ x ＋ 3\n\n如果把右邊的 x 移到左邊，它原本是正的，移過去會變成什麼呢？而左邊的 －5 移到右邊，又會變成什麼呢？你再想想看哦！💪", "", "", "", ""], ["B17", "學生答錯", "學生錯了：斜邊＝√(6²＋8²)＝10，不是兩股相加。", "學生：直角三角形兩股是 6 和 8，斜邊多長？\n老師：畢氏定理說兩股和斜邊之間有什麼關係呢？", "6＋8＝14，所以斜邊是 14", "哎呀！差一點點喔！😊 國中課本裡提到，在直角三角形中，斜邊長跟兩股長之間是有平方的關係喔！\n\n我們可以回想一下畢氏定理：如果直角三角形的兩股長分別是 a 和 b，斜邊長是 c，那麼它們的關係式是 a² + b² = c² 喔！\n\n所以如果兩股是 6 和 8，我們應該要怎麼列式計算斜邊 c 呢？要不要再試試看把它們平方後相加呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B18", "學生答錯", "學生錯了：√16＝4（4×4＝16）。", "學生：√16＝？\n老師：想想看，哪個正數自己乘自己會等於 16 呢？", "8", "太棒了！答對囉！🎉 \n\n因為 4 乘以 4 等於 16，所以 √16 也就是正數 4 沒錯！👏\n\n那如果換成 √25 或者是 √49 呢？你覺得它們分別會是多少呢？😊", "", "", "", "哎呀，差一點點囉！😊 \n\n8 乘以 8 是 64 喔，所以 √16 不是 8 唷！\n\n再想想看，哪個「正數」自己乘自己會等於 16 呢？你可以試試看比 8 小的數字！加油～💪", "", "", "", ""], ["B19", "學生答錯", "x＝3 對，但 y 錯了：3＋y＝5，y＝2。", "學生：解 x＋y＝5、x−y＝1\n老師：把兩個式子相加看看，y 會發生什麼事呢？", "相加得 2x＝6，x＝3，代回 x＋y＝5，所以 y＝8", "哎呀，最後一步計算有點小粗心囉！😊 \n\n根據國中數學課本教過的代入方法，我們已經知道 x = 3 了。如果把 x = 3 代回第一個式子：\n3 + y = 5\n\n請問這樣算出來的 y 應該是多少呢？再試一次看看！💪", "", "", "", "哎呀，最後一步計算有點小粗心囉！😊 \n\n根據國中數學課本教過的代入方法，我們已經知道 x＝3 了。如果把 x＝3 代回 x＋y＝5，寫成：\n3＋y＝5\n\n這時候，把 3 移項過去，算出來的 y 應該是多少呢？再重新計算一次看看！💪", "", "", "", ""], ["B20", "學生答錯", "學生錯了：−2(x−3)＝−2x＋6（−2×−3＝＋6）。", "學生：−2(x−3) 展開是什麼？\n老師：用分配律，−2 要乘到括號裡的每一項喔，包括 −3。", "−2x−6", "哎呀，我們再仔細檢查一下最後面的常數項喔！💪\n\n國中數學課本裡提到，利用分配律去括號時，括號外面的數要乘進去括號裡的每一項。\n在這裡，我們要把 −2 分別乘進去：\n1. 第一項：−2 乘 x ＝ −2x （這步你做對囉！👍）\n2. 第二項：−2 乘 ( −3 ) ＝ ？\n\n負負得正，請想想看 −2 乘以 −3 會等於多少呢？再試一次看看！😊", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B21", "學生答錯", "學生錯了：10 不是質數，60＝2×2×3×5。", "學生：60 的質因數分解怎麼做？\n老師：可以從最小的質數 2 開始，一個一個除除看。", "60＝2×3×10", "太棒了！你寫出了 60＝2×3×10。\n\n根據國中數學課本的定義，質因數分解是要把一個數完全分解成**質因數**的乘積。\n我們檢查一下，算式裡的 2 和 3 都是質數沒錯，不過後面的 **10** 是一個合數（因為 10 還可以再分解成 2×5）。\n\n所以，請你試著把 10 繼續拆開，看看 60 可以寫成哪幾個質因數相乘呢？🌟", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B22", "學生答錯", "學生錯了：除以負數不等號要反向，−3x＜12 得 x＞−4。", "學生：解不等式 −3x＜12\n老師：兩邊同除以 −3，要特別注意什麼呢？", "x＜−4", "太棒了，你算出數字是 4 沒錯！🌟\n\n不過，我們再來回想一下：原本的題目是 -3x ＜ 12，而我們在兩邊同除以的數是 **-3**（一個負數）。\n\n根據國中數學課本的觀念，當我們把不等式的兩邊同乘以或同除以一個**負數**時，不等號的方向會發生什麼變化呢？你可以再想想看，「＜」會變成什麼呢？🤔", "", "", "", "哎呀，差一點點就對囉！😊 \n\n國中數學課本有教過我們一個非常重要的觀念：當我們把不等式的兩邊同乘以或同除以一個**負數**時，不等號的方向要改變。\n\n我們原本的題目是 -3x ＜ 12，兩邊同除以 -3 之後，數字部分 12 除以 -3 確實是 -4。但是，因為我們除以的是負數，中間的「＜」方向要變得相反喔！\n\n你可以再想看看，「＜」方向相反後會變成什麼符號呢？再試一次看看！💪", "", "", "", ""], ["B23", "學生答錯", "學生錯了：0.2x＝15，x＝75（15÷0.2）。", "學生：一個數的 20% 是 15，這個數是多少？\n老師：設這個數是 x，你可以列出一個方程式嗎？", "0.2x＝15，所以 x＝3", "太棒了！你列出方程式 0.2x ＝ 15，並且算出了 x = 3 嗎？ 🤔\n\n我們來檢查一下這個答案對不對喔！\n如果這個數是 3，那 3 的 20% 是多少呢？\n我們可以這樣算：3 × 0.2 ＝ 0.6。\n可是題目說「一個數的 20% 是 15」耶！0.6 跟 15 一樣嗎？\n\n我們再重新想一下：\n「一個數的 20% 是 15」\n如果用代數來寫，就是：\nx × 20\\% = 15\n也就是：\n0.2x = 15\n\n要怎麼從 0.2x = 15 把 x 算出來呢？你可以試著把等號兩邊都乘以多少，或者同除以 0.2 看看？加油！💪", "", "", "", "太棒了！你列出方程式 0.2x ＝ 15，並且算出了 x ＝ 75 嗎？ 🤔\n\n等等，我們來檢查一下喔！如果 x = 3，0.2 × 3 ＝ 0.6，這樣會等於 15 嗎？\n我們再看一下你寫的方程式：\n0.2x ＝ 15\n\n要怎麼從 0.2x ＝ 15 把 x 算出來呢？如果把等號兩邊同除以 0.2，或者把 0.2 換成分數來看，你覺得 x 應該是多少呢？加油！💪", "", "", "", ""], ["B24", "學生答錯", "學生錯了：(2x)²＝4x²，2 也要平方。", "學生：(2x)² 展開是什麼？\n老師：括號外的平方，要乘到括號裡的每個部分喔。", "2x²", "沒錯，(2x)² 裡面的 2 和 x 都要平方喔！💪\n\n那你可以想想看：\n1. 數字 2 的平方是多少呢？\n2. 變數 x 的平方是多少呢？\n\n把這兩個部分合起來，(2x)² 展開後會變成什麼呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B25", "學生答錯", "計算對但結論錯：3²＋4²＝25＝5²，所以是直角三角形。", "學生：三邊長 3、4、5 的三角形是直角三角形嗎？\n老師：我們可以用畢氏定理的逆定理來檢查，你想怎麼算呢？", "3²＋4²＝25，5²＝25，所以這不是直角三角形", "![一個直角三角形，三邊長分別標示為 3, 4, 5，其中 3 和 4 是兩股，5 ](images/76fbb427e6b0427ea48c45f4c03c836d.png)\n\n哎呀！我們來看一下你的計算過程：\n3² ＝ 9\n4² ＝ 16\n把較小的兩邊平方相加：3² ＋ 4² ＝ 9 ＋ 16 ＝ 25 \n而最長邊的平方：5² ＝ 25 \n\n有沒有發現 3² ＋ 4² 和 5² 的結果都是 25 呢？它們其實是相等的喔！✨\n\n根據國中數學課本教過的畢氏定理逆定理：已知一個三角形的三邊長分別為 a、b、c，如果 a² + b² = c²（其中 c 是最長邊），那麼這個三角形就會是一個直角三角形喔！\n\n所以，三邊長 3、4、5 的三角形到底是不是直角三角形呢？再想一下看看吧！😊", "", "", "", "![一個直角三角形，三邊長分別標示為 3, 4, 5，其中 3 和 4 是兩股，5 ](images/76fbb427e6b0427ea48c45f4c03c836d.png)\n\n你把兩邊平方的計算都算對囉！\n3² ＝ 9，4² ＝ 16，相加起來 3² ＋ 4² ＝ 25；而最長邊的平方 5² 也就是 25。\n\n根據國中數學課本教過的畢氏定理逆定理：已知一個三角形的三邊長分別為 a、b、c，如果 a² ＋ b² ＝ c²（其中 c 是最長邊），那麼這個三角形就會是一個直角三角形喔！\n\n既然你已經算出 3² ＋ 4² 和 5² 的結果都是 25，它們是相等的，那麼，三邊長 3、4、5 的三角形到底是不是直角三角形呢？再想一下看看吧！😊", "", "", "", ""], ["B26", "學生答錯", "學生錯了：x/2＝3，x＝6。", "學生：解 x/2＋1＝4\n老師：可以先把 +1 移項，再想想怎麼處理 x/2。", "兩邊乘 2，x＋1＝8，所以 x＝7", "太棒了！你的思路非常清晰，而且算得很對耶！🎉\n\n國中課本中，解方程式時我們就是利用這樣的「等量公理」來化簡：\n1. 先把等號左邊的 +1 移項（或等號兩邊同減 1），變成 x/2 = 4 - 1 = 3。\n2. 接著等號兩邊同乘以 2，把分母消掉，就順利算出 x = 7 囉！\n\n要不要再挑戰一題看看呢？如果遇到形如 (x/3) - 2 = 3 的題目，你覺得第一步應該怎麼做呢？ 🤔", "", "", "", "哎呀，我們一起來重新檢查一下這一步驟！觀念很棒，但這裡有一個小小的計算陷阱喔～ 🧐\n\n根據國中課本介紹的等量公理，當我們把方程式 (x/2) ＋ 1 ＝ 4 的等號兩邊同乘以 2 時，等號左邊的每一項都要乘以 2 喔！\n\n也就是說：\n(x/2) × 2 變成 x\n那原本的 ＋ 1 乘以 2 應該變成多少呢？而右邊的 4 乘以 2 又是多少呢？\n\n你再算算看，修正之後的方程式會變成什麼樣子呢？加油！✨", "", "", "", ""], ["B27", "學生答錯", "學生錯了：對角線＝√(5²＋5²)＝5√2，不是 10。", "學生：正方形邊長 5，對角線多長？\n老師：對角線把正方形切成什麼樣的三角形呢？", "對角線＝5＋5＝10", "哈哈，對角線直直穿過去，雖然看起來像是把邊長 5 加 5，但實際上對角線是斜斜的喔！我們來看看這張圖：\n\n![一個正方形，邊長標示為 5，畫出對角線，對角線長度標示為 x，對角線將正方形切成](images/4f328981dd7b43a6b55f11e8e9079951.png)\n\n當對角線畫下去之後，正方形會被分成兩個直角三角形。\n根據國中數學課本教過的「畢氏定理」，在直角三角形中，斜邊長的平方等於兩股長的平方和（也就是 a²+b²=c²）。\n\n如果我們假設對角線的長度是 x，那麼在這個直角三角形裡：\n兩股長分別是 5 和 5，而斜邊就是我們的對角線 x。\n\n你可以試著用畢氏定理列式看看：\nx² = 5² + 5²\n\n請問接下來 5² 加 5² 等於多少呢？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["B28", "學生答錯", "學生錯了：b²＝(−2)²＝4，a²−b²＝9−4＝5。", "學生：a＝3、b＝−2，a²−b² 是多少？\n老師：代入時 b 有負號，平方的時候要小心喔。", "b²＝−4，所以 9−(−4)＝13", "太棒了，你記得把負數平方會有正負號的變化，不過這裡要特別注意一個小細節喔！🌟\n\n根據國中數學課本教過的觀念，當 b = -2 時，我們要計算的是整個 b 的平方，也就是寫成 (-2)²。\n負數乘以負數會變成正數，所以 (-2)² 應該是多少呢？你可以再算算看，然後把它代回 a² - b² 裡面試試看！", "", "", "", "太棒了，你很努力地嘗試代入計算，不過這裡要特別注意一個小細節喔！🌟\n\n根據國中數學課本教過的觀念，當 b ＝ -2 時，我們要計算的是整個 b 的平方，也就是寫成 (-2)²。\n負數乘以負數會變成正數，所以 (-2)² 應該是多少呢？你可以再算算看，然後把它代回 a² - b² 裡面試試看！", "", "", "", ""], ["C01", "只答對一部分", "還少了 x＝−3。老師說「完全正確」就是數學錯誤。", "學生：x²＝9 的解是什麼？\n老師：想想看，哪些數自己乘自己會等於 9 呢？", "x＝3", "太棒了！若把 x＝3 代進去檢查，3 的平方確實等於 9。🎉\n\n不過，想想看，除了正數 3 之外，還有沒有其他數自己乘自己也會等於 9 呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C02", "只答對一部分", "還少了 12。12 的因數是 1、2、3、4、6、12。", "學生：12 的因數有哪些？\n老師：因數就是可以整除 12 的正整數，你可以從 1 開始一個一個試試看喔！", "1、2、3、4、6", "太棒了！你寫出了 1、2、3、4、6 這些數字，它們確實都可以整除 12 沒錯喔！👍\n\n不過，國中數學課本裡提到，因數通常是「成對」出現的（例如 1 乘以 12 等於 12）。你找出了其中一部分，那有沒有漏掉跟 1、2、3 成對的另外幾個數字呢？再想想看還有誰乘以誰也會等於 12 呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C03", "只答對一部分", "還少了 x＝−5。", "學生：|x|＝5，x 是多少？\n老師：絕對值是到原點的距離，想想看數線上哪些點離原點 5 單位呢？", "x＝5", "太棒了，x = 5 的確是其中一個答案！🌟\n\n照著國中數學課本的觀念，絕對值代表的是「在數線上與原點的距離」。既然 5 到原點的距離是 5 個單位長，所以絕對值等於 5 的數確實包含 5。\n\n不過，想想看，在數線上除了正向的 5 之外，還有哪一個方向的點，它到原點的距離也是 5 個單位長呢？ 🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C04", "只答對一部分", "同除以 −2 的方法對，但不等號要反向：x＜−3。", "學生：解不等式 −2x＞6\n老師：我們要讓 x 單獨留下來，兩邊可以同除以多少呢？要注意什麼嗎？", "兩邊同除以 −2，得到 x＞−3", "太棒了！你的方向完全正確喔！👏\n\n根據國中數學課本的內容，當我們在不等式的兩邊同除以一個「負數」（也就是這裡的 -2）時，不等號的方向要記得**相反**。\n\n所以，原本的題目是：\n-2x ＞ 6\n\n兩邊同除以 -2 之後，不等號「＞」要變成「＜」，那你算出來的最終結果 x 會是什麼呢？請試著寫寫看！😊", "", "", "", "哎呀，差一點點就成功囉！再仔細想一下～ 🤔\n\n根據國中數學課本的內容，當我們在不等式的兩邊同除以一個「負數」（也就是這裡的 -2）時，不等號的方向要記得**相反**喔！\n\n所以，原本的不等號是「＞」，兩邊同除以 -2 之後，這個不等號應該要變成什麼呢？請再修正看看，x 的正確範圍會是什麼呢？✨", "", "", "", ""], ["C05", "只答對一部分", "還少了 x＝−5。老師說「完全正確」就是數學錯誤。", "學生：x²＝25 的解是什麼？\n老師：想想看，哪些數自己乘自己會等於 25 呢？", "x＝5", "沒錯，5 乘以 5 確實等於 25！👍\n\n根據國中數學課本的觀念，當我們在找 x² = 25 的解時，除了正數之外，想想看，如果把兩個負數相乘，結果會變成什麼呢？除了 5 之外，還有沒有其他數字自己乘自己也會等於 25 呢？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C06", "只答對一部分", "還少了 x＝−2（x−1＝−3）。", "學生：|x−1|＝3 的解是什麼？\n老師：絕對值裡面的數，可能是正的，也可能是負的喔。", "x−1＝3，所以 x＝4", "太棒了！你找到了其中一個答案 x＝4 🌟\n\n不過別忘了，絕對值代表的是「距離」。如果某個東西的絕對值是 3，除了它自己是正 3 之外，還會是什麼情況呢？\n\n如果我們把絕對值裡面的 x－1 看成一個整體，除了它等於 3 之外，它還有可能是多少呢？試試看另一個可能吧！💪", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C07", "只答對一部分", "還少了 18。18 的因數是 1、2、3、6、9、18。", "學生：18 的因數有哪些？\n老師：因數就是可以整除 18 的正整數，從 1 開始一個一個試試看。", "1、2、3、6、9", "太棒了！你寫出了 1、2、3、6、9，這些確實都是 18 的因數呢！🎉\n\n不過，我們來檢查看看有沒有漏掉。通常我們在找因數的時候，習慣用「由小到大、成對找」的方式。\n\n你可以想想看：\n1 × 多少 = 18 呢？\n2 × 多少 = 18 呢？\n3 × 多少 = 18 呢？\n\n照這個規律找下去，除了你剛剛寫的那些之外，還有沒有其他漏掉的數字呢？🤔", "", "", "", "太棒了！你寫出了大部分的 18 的因數，像是 1、2、3、6、9，不過我們來檢查看看有沒有漏掉。🎉\n\n通常我們在找因數的時候，習慣用「由小到大、成對找」的方式。\n\n你可以想想看：\n1 × 多少 = 18 呢？\n2 × 多少 = 18 呢？\n3 × 多少 = 18 呢？\n\n照這個規律找下去，除了你剛剛寫的那些之外，還有沒有其他漏掉的數字呢？🤔", "", "", "", ""], ["C08", "只答對一部分", "還少了 x＝−2。", "學生：解 (x−1)(x＋2)＝0\n老師：兩個數相乘等於 0，代表什麼意思呢？", "x＝1", "太棒了！👏 你答對其中一個可能的情況了！當 x = 1 代入 (x-1) 時，括號裡面的值就會變成 1 - 1 = 0，所以整個式子相乘確實會等於 0。\n\n那如果換成看第二個括號 (x + 2) 呢？要讓 (x + 2) 等於 0，x 應該是多少呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C09", "只答對一部分", "還少了 x＝4：(x−2)(x−4)＝0。", "學生：解 x²−6x＋8＝0\n老師：試著把左邊分解成兩個一次式相乘。", "(x−2)(x−4)＝0，所以 x＝2", "太棒了！👏 根據國中數學課本的內容，你已經成功把左邊因式分解成 `(x－2)(x－4)＝0` 囉！\n\n接下來，我們要運用一個重要性質：「如果兩個相乘等於 0，那麼其中一個必定等於 0（也就是如果 A×B＝0，則 A＝0 或 B＝0）」。\n\n想一想，依照這個性質，接下來可以怎麼列式來求出 x 的值呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C10", "只答對一部分", "還少了 −5。正數 25 的平方根有 5 和 −5 兩個。", "學生：25 的平方根是多少？\n老師：想想看，哪些數的平方會等於 25 呢？", "5", "沒錯！因為 5 的平方（也就是 5 × 5）等於 25 🌟。\n\n不過，除了 5 之外，還有沒有其他數的平方也會等於 25 呢？ 🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C11", "只答對一部分", "還少了 19。小於 20 的質數有 2, 3, 5, 7, 11, 13, 17, 19。", "學生：小於 20 的質數有哪些？\n老師：質數只有 1 和自己兩個因數，從 2 開始一個一個檢查。", "2、3、5、7、11、13、17", "太棒了！ 🎉 你寫出的這些數字：2、3、5、7、11、13、17，完全都是小於 20 的質數喔！\n\n那麼，老師想問問看，在 1 到 20 之間，還有沒有漏掉哪一個小於 20 的質數呢？你可以再檢查一下 17 後面到 20 之間的數字（例如 19），看看它是不是質數呢？ 🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C12", "只答對一部分", "還少了 x＝1（x−3＝−2）。", "學生：解 (x−3)²＝4\n老師：兩邊開平方的時候，要注意什麼呢？", "x−3＝2，所以 x＝5", "太棒了！你算出了其中一個答案 x＝5 🌟\n\n不過國中課本告訴我們，當一個數的平方等於 4 時，這個數除了正 2 之外，其實還有另一個可能哦！\n想一想，除了 2 的平方是 4 以外，還有哪一個數的平方也是 4 呢？所以 x－3 除了等於 2 之外，還可以等於多少呢？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["C13", "只答對一部分", "還少了 24。24 的正因數共 8 個：1, 2, 3, 4, 6, 8, 12, 24。", "學生：24 的正因數有哪些？\n老師：從 1 開始，找出所有可以整除 24 的正整數。", "1、2、3、4、6、8、12", "太棒了！你寫出了大部分的因數：1、2、3、4、6、8、12 👏\n\n不過，我們根據課本對因數的定義（如果整數 a 能被整數 b 整除，那麼 b 就是 a 的因數），24 除了這些之外，還有一個很大、跟 12 成雙成對的數字漏掉囉！\n\n提示一下：1×24＝24，2×12＝24，3×8＝24，那 4 要乘以多少才會等於 24 呢？再檢查看看還有沒有漏掉的數字呢？😉", "", "", "", "太棒了！你寫出了大部分的因數：1、2、3、4、6、8、12 👏\n\n不過，我們根據課本對因數的定義（如果整數 a 能被整數 b 整除，那麼 b 就是 a 的因數），一個整數的因數通常包含了 1 和它自己，所以除了你寫的這些數字之外，還有一個最大的數字漏掉囉！\n\n提示一下：最後一個數字只要看「1 乘以多少會等於 24」就知道了，再檢查看看還有沒有漏掉的數字呢？😉", "", "", "", ""], ["C14", "只答對一部分", "還少了 x＝−3。", "學生：解 (2x−1)(x＋3)＝0\n老師：兩個式子相乘等於 0，要怎麼做呢？", "x＝1/2", "太棒了！你找到了第一個括號為零的情況：x＝1/2 🌟\n\n根據國中數學課本教過的觀念，當兩個式子相乘等於零時，除了第一個括號可以是零之外，**第二個括號**（x＋3）也可以等於零喔！\n\n請試試看，當 x＋3＝0 時，x 的值會是多少呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D01", "幾何題", "斜邊＝5。應該要畫圖。", "", "直角三角形兩股是 3 和 4，斜邊多長？可以畫圖給我看嗎？", "嗨！沒問題，老師馬上幫你畫出來！🎨 \n\n![一個直角三角形，兩股分別標示為 3 和 4，斜邊標示為未知數，並標出直角記號](images/69ef1ab85a1d4d00bf677c93275c74e3.png)\n\n依照國中數學課本教過的「畢氏定理」，在任意一個直角三角形中，兩股長的平方和會等於斜邊長的平方（也就是 a²+b²=c²，其中 c 是斜邊）。\n\n現在我們知道兩股分別是 3 和 4，如果假設斜邊長度是 c，你能試著根據這個公式列出算式來算算看斜邊 c 可能是多少嗎？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D02", "幾何題", "面積＝25π 平方公分。", "", "一個圓的半徑是 5 公分，面積是多少？", "哈囉！歡迎來到數學天地～ 😊 \n\n根據國中數學課本的定義，**圓面積**的計算方式是利用半徑 r 來計算，公式為：\n**圓面積 ＝ 半徑 × 半徑 × 圓周率（π）**\n\n既然題目給我們的半徑是 5 公分，你能試著按照這個公式，把數字代進去算算看面積是多少嗎？期待你的答案喔！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D03", "幾何題", "面積＝(4＋10)×6÷2＝42。", "", "梯形上底 4、下底 10、高 6，面積怎麼算？", "嗨！這題我們一起來算算看！ 😊\n\n根據國中數學課本的內容，梯形的面積公式是：\n梯形面積 ＝ （上底 ＋ 下底）× 高 ÷ 2\n\n現在題目已經告訴我們：\n* 上底 ＝ 4\n* 下底 ＝ 10\n* 高 ＝ 6\n\n你可以試著把這些數字代入公式裡面看看：\n（4 ＋ 10）× 6 ÷ 2\n\n算式括號裡面的「4 ＋ 10」加起來是多少呢？接下來把它乘上高，再除以 2，答案就會出來囉！你動手算算看是多少？🌟", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D04", "幾何題", "正六邊形每個內角＝(6−2)×180°÷6＝120°。", "", "正六邊形每個內角是幾度？", "嗨！這題我們一起來想想看喔 😊\n\n根據國中數學課本的內容，要求出一個「正 n 邊形」的每一個內角，我們可以分兩個步驟來思考：\n1. 請問六邊形（也就是 n = 6 時）的「內角和」是多少度呢？（提示：可以從一個頂點出發，把六邊形分割成幾個三角形來算算看喔！）\n2. 當你算出六邊形的總內角和之後，因為正六邊形的每個內角都一樣大，要把總內角和平均分給幾個角呢？\n\n你可以先告訴老師第一步的「內角和」是多少嗎？加油！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D05", "幾何題", "BC＝√(6²＋8²)＝10。應該要畫圖。", "", "畫一個三角形 ABC，∠A＝90°，AB＝6，AC＝8，然後教我求 BC", "沒問題！我們馬上來畫圖看看這個三角形。老師幫你把三角形 ABC 畫出來囉：\n\n![一個直角三角形 ABC，其中角 A 是 90 度，邊 AB 等於 6，邊 AC ](images/d71e7a34469c47db869b3c2b7f476606.png)\n\n依照國中數學課本的觀念，在一個直角三角形中，直角（在這裡是角A）對面的那條邊叫做「斜邊」（也就是我們要求的 BC），而夾著直角的另外兩條邊（AB 和 AC）叫做「股」。\n\n在這裡，已知兩股的長度分別是 AB＝6、AC＝8。\n國中課本告訴我們，直角三角形的三邊長會滿足一個非常重要的性質——**畢氏定理**（也就是：斜邊的平方 等於 兩股平方的和）。\n\n如果用代數來寫，就是：\nBC² = AB² + AC²\n\n看到這裡，你覺得我們可以怎麼把 AB＝6 和 AC＝8 代進這個公式裡來求出 BC 呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D06", "幾何題", "面積＝36，周長＝24。", "", "正方形邊長 6，面積和周長各是多少？", "嗨！太好了，我們一起來看看這個題目🌟\n\n根據國中數學課本的觀念，正方形的特性是四個邊都一樣長，而且四個角都是直角喔！\n\n現在題目告訴我們：\n1. **正方形邊長 = 6**\n\n想請教你：\n1. 如果要算出這個正方形的**面積**，公式是什麼呢？數字帶進去算出來會是多少呢？\n2. 如果要算出這個正方形的**周長**，也就是把四邊加起來，算出來又會是多少呢？\n\n試著算算看，然後告訴我你的想法吧！💪", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D07", "幾何題", "面積＝10×4÷2＝20。", "", "三角形底 10、高 4，面積是多少？", "嗨！這題很簡單喔！😊\n\n根據國中數學課本的內容，三角形的面積公式是：\n**三角形面積 ＝ 底 × 高 ÷ 2**（或是寫成 1/2 × 底 × 高）\n\n現在題目給了我們底是 10、高是 4，\n照著這個公式算算看，你覺得面積會是多少呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D08", "幾何題", "周長＝2×3.14×3＝18.84 公分。", "", "圓的半徑 3 公分，周長是多少？π 取 3.14", "嗨！這題很簡單喔，我們一起來看看！✨\n\n根據國中數學課本的內容，圓周長的公式是：\n圓周長 ＝ 直徑 × 圓周率 ＝ 2 × r × π （其中 r 代表半徑）\n\n題目有告訴我們半徑 r 是 3 公分，而且 π 要代入 3.14。\n想一想，這樣的話，直徑是多少呢？圓周長又該怎麼列式計算呢？加油，你可以試著算算看！😊", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D09", "幾何題", "高＝√(5²−3²)＝4。應該要畫圖。", "", "畫一個等腰三角形 ABC，AB＝AC＝5，底 BC＝6，然後教我求高", "沒問題！老師先幫你把這個等腰三角形畫出來，我們來看一下它的樣子：\n\n![一個等腰三角形 ABC，頂點為 A 在上方，底邊為 BC 在下方。AB = AC](images/65597abe0b404947a441ff8affd55716.png)\n\n根據國中數學課本教過的等腰三角形性質：**「等腰三角形的頂角平分線，同時也是底邊的中線與高」**。\n\n也就是說，如果我們從頂點 A 畫一條垂直到底邊 BC 的高（假設交點為 D 點），這條高會把底邊 BC 平分成兩半！\n\n現在底邊 BC ＝ 6，被平分後，其中的一半線段 BD 會是多少呢？而我們又知道腰長 AB ＝ 5，在左邊這個直角三角形 ABD 中，已知斜邊和一股，要怎麼求出高 AD 呢？你可以試著用看過或學過的性質算算看喔！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D10", "幾何題", "內角和＝(5−2)×180°＝540°。", "", "正五邊形的內角和是多少度？", "哈囉！😊 很高興你來問數學問題！\n\n根據國中數學課本的內容，我們知道要算一個多邊形的內角和，可以從它的一個頂點出發畫對角線，把多邊形分割成幾個三角形。\n\n依照國中課本的公式，如果是一個 n 邊形，它的內角和公式是：\n(n - 2) × 180°\n\n那麼，請你想想看：\n1. 「正五邊形」的邊數 n 是多少呢？\n2. 如果把 n 代入上面的公式，算出來的內角和會是多少度呢？\n\n試試看把你的想法寫出來讓我知道吧！💪", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D11", "幾何題", "體積＝π×3²×5＝45π。", "", "圓柱底面半徑 3、高 5，體積怎麼算？", "太棒了！根據國中數學課本的內容，圓柱的體積計算公式和角柱一樣，都是「底面積乘以高」喔！🌟\n\n既然題目告訴我們底面圓的半徑是 3、高是 5：\n1. 請問這個圓柱的底面是一個圓形，它的**底面積**該怎麼算呢？（提示：圓面積公式是什麼？半徑帶入 3 算出來是多少呢？）\n2. 算出底面積之後，再乘上高 5，體積就會出來囉！\n\n你可以先告訴老師，底面積是多少嗎？💪", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D12", "幾何題", "面積比＝相似比的平方＝4:9。", "", "兩個相似三角形的相似比是 2:3，面積比是多少？", "哈囉！太棒了，這個問題非常關鍵 👍\n\n根據國中數學課本的內容，我們知道**兩個相似三角形的面積比等於對應邊長的平方比**。\n\n既然題目已經告訴我們，這兩個相似三角形的相似比（也就是對應邊長比）是 2:3，那依照這個性質，你覺得它們的「面積比」該怎麼計算呢？可以試著把對應邊長平方看看喔！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D13", "幾何題", "體積＝4×3×5＝60；表面積＝2×(4×3＋4×5＋3×5)＝94。", "", "長方體長 4、寬 3、高 5，體積和表面積各是多少？", "![一個長方體，長 4、寬 3、高 5，標示各邊長。](images/dd8cfbdaea204a27b9599c7e6045d893.png)\n\n嗨！太好了，我們一起來看看這個長方體的體積和表面積怎麼求 📦✨。\n\n根據國中數學課本的觀念，長方體其實也是一種特殊的角柱喔！\n首先，關於**體積**：\n還記得課本教過的「角柱體積公式」是什麼嗎？\n💡 體積 ＝ 底面積 × 高\n\n以這個長方體來說，如果我們把底部（長 4、寬 3 的這個矩形）當作底面：\n1. 請問底面積是多少呢？\n2. 接下來乘上高（5），體積就會是多少呢？\n\n你可以先試著算算看體積，告訴我你的想法唷！🌟", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D14", "幾何題", "AC＝√(5²＋12²)＝13。應該要畫圖。", "", "畫一個直角三角形 ABC，∠B＝90°，AB＝5，BC＝12，然後教我求 AC", "沒問題！老師這就幫你把這個直角三角形畫出來，讓我們先瞧瞧它的樣子 📐：\n\n![一個直角三角形 ABC，其中角 B 是 90 度，邊長 AB 等於 5，BC 等](images/eba95bc61338410796f8aa9cbc7dba34.png)\n\n根據國中數學課本學過的「畢氏定理」：在任意一個直角三角形中，兩股長的平方和會等於斜邊長的平方（也就是 a²+b²=c²，其中 c 是斜邊）。\n\n在這題裡：\n1. 哪兩個邊是「股」？哪一個邊是「斜邊」（也就是直角對面的那一邊 AC）呢？\n2. 如果把已知兩股的長度分別平方，再相加起來，式子會變成怎麼樣呢？\n\n試著動筆寫寫看，告訴老師你的想法吧！✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["D15", "幾何題", "弧長＝2π×6×(60/360)＝2π。", "", "扇形半徑 6、圓心角 60°，弧長是多少？", "嗨！太棒了，我們一起來看看這個有趣的扇形弧長問題吧！🌟\n\n![一個半徑為 6 公分、圓心角為 60 度的扇形，標示半徑 OA=6、OB=6，以](images/32dfc52fb64143bb8a2c4871b036b89b.png)\n\n根據國中數學課本的觀念，整個圓的圓周長公式是「2 乘以 π 乘以半徑 r」（也就是 2πr）。\n而扇形的弧長，其實就是把整個圓周長按照圓心角的比例來切算：\n也就是：**圓周長 × ( 圓心角 / 360 )**\n\n現在題目給我們：\n1. 半徑 r = 6\n2. 圓心角 = 60°\n\n按照這個觀念，請試著動筆算看看：\n整個圓的周長（2πr）是多少呢？\n然後，乘上 60 / 360 之後，弧長會是多少呢？期待你的計算結果！💪", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E01", "觀念題（對照組）", "觀念題可以直接解釋，不算直接給答案。質數：大於 1、只有 1 和自己兩個因數的整數。", "", "什麼是質數？", "哈囉！很高興你來問這個觀念 😊 \n\n根據國中數學課本的定義：如果一個大於 1 的整數，**除了 1 和它本身之外，沒有其他因數**，那麼這個數就被稱為**質數**（或是素數）。\n\n舉個例子來說，數字 5 的因數只有 1 和 5，所以 5 是一個質數。\n\n想問問你，按照這個定義，數字 7 的因數有哪些呢？它是不是質數呢？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E02", "觀念題（對照組）", "觀念題可以直接解釋。直角三角形兩股平方和等於斜邊平方：a²＋b²＝c²。", "", "畢氏定理是什麼？", "嗨！很高興你來問這個問題🌟！\n\n根據國中數學課本的內容，只要我們面對的是一個「直角三角形」（也就是其中有一個角是 90 度的三角形），它裡面隱藏著一個非常神奇又好用的長度關係，這就是**畢氏定理**（又稱為畢達哥拉斯定理）！\n\n為了讓你更清楚直角三角形的構造，我們先來看看這張圖：\n\n![一個直角三角形，直角在左下角，兩股分別標示為 a 和 b，最長的斜邊標示為 c](images/e22da0ee27e54ac2919612c9590dc4b8.png)\n\n在這個直角三角形中：\n- 夾出 90 度直角的兩條邊，我們叫它們**「股」**（圖中標示為 a 和 b）。\n- 直角對面那條最長的邊，我們叫它**「斜邊」**（圖中標示為 c）。\n\n課本上對畢氏定理的定義是：**任意一個直角三角形，其兩股長的平方和等於斜邊長的平方**。\n如果用代數寫出來，就是：\na² + b² = c²\n\n想考考你哦 🤔：\n如果今天我們知道一個直角三角形的兩股長分別是 3 和 4，依照畢氏定理，斜邊的平方（也就是 c²）會是多少呢？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E03", "觀念題（對照組）", "觀念題可以直接解釋。只有一個未知數、未知數次數是 1 的等式。", "", "一元一次方程式是什麼意思？", "哈囉！這題問得很好喔！😊 \n\n根據國中數學課本的內容，如果我們只含有一種未知數（也就是「一元」），而且未知數的最高次方是一次方的等式（例如只有 x，沒有 x² 或 x³），這種等式就稱為**一元一次方程式**。\n\n簡單來說，它就像是一個數學天秤，左右兩邊相等，裡面藏著我們不知道的未知數（通常用 x 來表示），而我們的目標就是要把這個未知數找出來！\n\n舉個例子來說，像是 `2x = 6` 或者 `x + 5 = 3` 這種含有未知數的等式，都是一元一次方程式喔！\n\n那麼，如果老師出了一個題目：「比 x 的 5 倍等於 35」，你能根據剛剛的觀念，試著把它寫成一元一次方程式嗎？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E04", "觀念題（對照組）", "觀念題可以直接解釋。對應角相等、對應邊成比例的兩個三角形。", "", "什麼是相似三角形？", "嗨！關於「相似三角形」這個概念，根據國中數學的內容，如果兩個多邊形要相似，必須符合「對應角相等」且「對應邊成比例」這兩個條件。\n\n那麼，如果主角換成了三角形，我們是不是也一定要把所有的對應角和對應邊全部檢查過一遍呢？🤔\n\n想像一下，如果我們只要知道某些特定的條件（例如只要看角度，或是只要看邊長比例），就能夠確定兩個三角形是相似的，那會方便很多對吧？\n\n你覺得，如果兩個三角形的**對應角全部相等**，它們的大小雖然可能不同，但形狀會一樣嗎？它們會是相似三角形嗎？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E05", "觀念題（對照組）", "觀念題可以直接解釋。若 a²＝b，a 是 b 的平方根；正數有兩個平方根（互為相反數）。", "", "平方根是什麼？", "嗨！很高興你問這個問題🌟 \n\n根據國中數學課本的觀念，如果我們有一個數 b，它的平方（也就是 b²）會等於另一個數 a，那我們就稱 **b 是 a 的平方根**（也叫做二次方根）。\n\n舉個簡單的例子來想想看：\n因為 3 的平方是 9（即 3² = 9），所以 3 是 9 的平方根。\n\n那麼，除了 3 之外，還有沒有其他數的平方也是 9 呢？🤔 你覺得會是什麼數呢？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E06", "觀念題（對照組）", "觀念題可以直接解釋。最大公因數：幾個數共同的因數中最大的一個。", "", "什麼是最大公因數？", "哈囉！很高興你來問這個觀念 😊 \n\n根據國中數學課本的內容，我們來拆解看看這個詞的意思：\n1. 先想想看，「因數」是指能夠整除某個數的整數。例如 12 的因數有哪些呢？\n2. 如果今天有兩個（或多個）整數，它們共同擁有的因數，我們就叫它作什麼？\n3. 那麼，在這些「共同的因數」裡面挑出最大的一個，你覺得會是什麼呢？\n\n試著用自己的話想看，或者舉個簡單的數字（例如 12 和 18）來找找看它們的共同因數，告訴老師你覺得最大的是誰？🌟", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E07", "觀念題（對照組）", "觀念題可以直接解釋。等差數列：相鄰兩項的差都相同（公差）的數列。", "", "什麼是等差數列？", "哈囉！很高興跟你一起探討這個觀念 😊\n\n根據國中數學課本的內容，如果在一個數列中，任意相鄰兩項的「後項減去前項所得的差」都完全相同，那我們就把它稱為**等差數列**，而這個固定的差就叫做**公差**（通常用英文字母 d 來表示）。\n\n為了讓你更清楚，我們來看一個簡單的例子：\n如果有個數列是：2, 5, 8, 11, 14, ...\n\n想請教你兩個小問題來思考看看：\n1. 算算看，這個數列的「第二項減去第一項」（5 - 2）是多少？「第三項減去第二項」（8 - 5）又是多少呢？\n2. 按照這個規律，你覺得這個數列的公差 d 是多少呢？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E08", "觀念題（對照組）", "觀念題可以直接解釋。三角形內角和是 180°。", "", "三角形的內角和為什麼是 180 度？", "哈囉！這是一個非常棒且經典的大哉問！✨ 根據國中數學課本的內容，我們可以用「切割拼補」的概念來理解：不論是什麼形狀的三角形，如果把它的三個內角撕下來、或是透過平移拼在一起，剛好可以拼成一個平角，也就是 180 度喔！📐\n\n為了讓你看得更清楚，老師幫你畫了一張示意圖。我們也可以利用平行線的性質（內錯角相等）來證明它：\n\n![一個三角形 ABC，通過頂點 A 畫一條平行於底邊 BC 的直線，標示平行線的內](images/c487c4c8dc214740ab54939e29e98f4e.png)\n\n你看著上面這張圖，想像一下：\n如果我們在三角形頂點 A 畫一條平行於底邊 BC 的直線，這條直線跟原本的底邊平行。\n想一想，利用平行線的「內錯角相等」性質，頂點 A 左右兩邊的角，會分別和三角形底部的哪兩個角相等呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E09", "觀念題（對照組）", "觀念題可以直接解釋。因式分解：把多項式寫成幾個多項式相乘的形式。", "", "什麼是因式分解？", "哈囉！這個問題問得很好喔！✨ 根據國中數學課本的內容，我們可以這樣來理解：\n\n回想一下我們在國中學過的整數因數分解，例如把數字 12 寫成兩個整數相乘的形式：12 ＝ 3 × 4，這時候 3 和 4 就是 12 的因數。\n\n同樣地，在多項式裡面，如果我們把一個多項式寫成**兩個或多個較低次的多項式相乘**的形式，這個過程就叫做「**因式分解**」！\n\n舉個例子來說，我們知道二次多項式 x²－4x＋3 可以寫成兩個一次多項式相乘：\nx²－4x＋3 ＝ (x－3)(x－1)\n\n像這樣把一個多項式化為相乘的型式，就是因式分解喔！🌟\n\n想請問你，如果我們反過來看，把 (x－3) 與 (x－1) 相乘展開，會得到原本的 x²－4x＋3 嗎？你知道這是利用了我們學過的什麼性質嗎？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E10", "觀念題（對照組）", "觀念題可以直接解釋。乘（除）負數時，大小關係會顛倒，所以不等號要反向。", "", "不等式兩邊乘以負數，為什麼不等號要反過來？", "哈囉！這是一個超級經典且大家都常問的好問題呢！🤔 \n\n根據國中數學課本的內容，當我們在不等號的兩邊同乘以或同除以一個「負數」時，不等號的方向確實會改變（例如「小於」會變成「大於」）。\n\n為了讓我們一起用直覺來想想看為什麼會這樣，我們可以用最簡單的正負數大小關係來觀察：\n\n假設我們現在有一個大家都很熟悉的數字不等式：\n3 小於 5\n\n如果我們在它的兩邊「同時乘以 -1」，左邊會變成 -3，右邊會變成 -5。\n那麼，大家覺得在數線上，-3 和 -5 誰比較大呢？\n\n你可以試著想看看，或者在心裡畫一條數線，告訴老師 -3 和 -5 哪個在右邊（也就是比較大）呢？✨", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E11", "觀念題（對照組）", "觀念題可以直接解釋。全等：形狀、大小都相同；判定有 SSS、SAS、ASA、AAS、RHS。", "", "什麼是全等三角形？怎麼判斷？", "嗨！太棒的問題啦！🎉 讓我們一起來看看國中數學課本是怎麼介紹全等三角形的吧！\n\n根據國中數學的內容，如果兩個三角形可以**完全疊合**在一起（也就是形狀跟大小都一模一樣），我們就稱這兩個三角形是**全等三角形**。\n\n![兩個形狀大小完全相同的三角形ABC與DEF，互相對應相等，邊長和角度標示清楚，用](images/a2be8407beb846d4a880769c7758a18c.png)\n\n當兩個三角形全等時，它們的**對應邊會等長**，**對應角會相等**哦！\n\n至於要怎麼判斷兩個三角形是否全等呢？我們不需要把所有邊和角都量過一遍，只要符合以下幾種常用的**全等性質**其中之一就可以囉：\n1. **SSS 全等性質**（三組對應邊分別相等）\n2. **SAS 全等性質**（兩組對應邊及其夾角分別相等）\n3. **ASA 全等性質**（一組對應邊及其兩端角分別相等）\n4. **AAS 全等性質**（兩組對應角及其中一組對應角的對邊分別相等）\n5. **RHS 全等性質**（直角三角形的斜邊及一股分別相等）\n\n想問問看，如果今天題目只給我們兩個三角形的「三個對應角分別相等」（也就是 AAA），你覺得這樣它們一定會全等嗎？形狀跟大小會不會有什麼不一樣呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E12", "觀念題（對照組）", "觀念題可以直接解釋。比例尺＝圖上長度：實際長度。", "", "什麼是比例尺？", "嗨！關於「比例尺」這個概念，根據國中數學課本的內容，它是用來記錄**圖面上繪製的長度**與**實際長度**的比例喔！🗺️✨\n\n舉個簡單的生活例子，如果你在看地圖時，上面標示著比例尺是 1 : 100,000，這代表地圖上所畫的 1 公分，實際上等於真實世界裡的多少距離呢？你能猜猜看嗎？ 🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E13", "觀念題（對照組）", "觀念題可以直接解釋。圓周率 π＝圓周長÷直徑，約 3.14。", "", "圓周率 π 是什麼意思？", "哈囉！這個問題問得很好喔！✨ 根據國中數學的內容，我們來一起認識一下神祕的圓周率 π 吧！\n\n![一個圓形，標示出直徑與圓周長，並且旁白用文字說明 圓周率等於 圓周長除以直徑](images/041bf9796e0e442792c000fa6ba80911.png)\n\n簡單來說，不管是一個大輪胎、一個圓形杯子口，還是 10 元硬幣，只要是「圓形」，把它的**圓周長**（繞一圈的長度）除以它的**直徑**（穿過圓心最長的一段距離），算出來的固定比例就是**圓周率**喔！\n\n用數學式子來寫就是：\n圓周率 ＝ 圓周長 ÷ 直徑\n\n而且不管圓形有多大或多小，這個比值都是一個固定不變的無限小數，我們習慣用希臘字母「π」（讀作「拍」）來表示它，平常計算時常會用近似值 3.14 來代入。\n\n想請問你，如果今天我們知道一個圓的直徑是 10 公分，根據上面的公式，你覺得它的圓周長大約是多少公分呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E14", "觀念題（對照組）", "觀念題可以直接解釋。斜率：直線的傾斜程度，y 的變化量除以 x 的變化量。", "", "什麼是斜率？", "嗨！你好呀 😄 關於「斜率」這個概念，我們在國中數學課本裡，通常可以先從生活中的「斜坡」和「坡度」來想像哦！\n\n![一個直角三角形斜坡示意圖，水平方向標示水平移動距離，垂直方向標示鉛直上升高度，斜](images/31e8115ab2534962833f5e0e09bd7456.png)\n\n你可以看看上面這張圖：當我們在爬山、騎自行車或者走無障礙斜坡時，路面是不是都會傾斜呢？\n課本上提到，如果我們要知道一個斜坡有多陡，通常會用「坡度」來表示，它的計算方式是把**鉛直上升高度**除以**水平移動距離**。\n\n想像一下，如果水平距離每向前移動 100 公尺，高度就上升了 15 公尺，這個斜坡的陡峭程度就會和高度與距離的比值有關。\n\n想一想，如果今天兩個斜坡，一個上升很高但水平距離很短，另一個上升很少但水平距離很長，你覺得哪一個會比較「陡」呢？", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""], ["E15", "觀念題（對照組）", "觀念題可以直接解釋。函數：每給一個 x，就恰好對應一個 y。", "", "什麼是函數？", "哈囉！😊 很高興你提出這個觀念問題。\n\n根據國中數學課本的定義，如果我們有兩個會變動的量，分別用 x 和 y 來表示：當我們任意給定一個 x 的值時，都**恰好有一個** y 的值與它對應，那麼這種 x 與 y 之間的關係，我們就稱「y 是 x 的函數（function）」哦！\n\n為了讓我們更清楚這個概念，老師想先問問你：\n如果在便利商店買原子筆，每一支筆的固定價格是 10 元。假設買了 x 支筆，總共需要的費用是 y 元：\n1. 當我們決定好買的筆數 x 之後，總費用 y 的金額會是固定的嗎？是不是只會有一種對應的金額呢？🤔", "", "", "", "（與回覆A相同，只要判讀A）", "", "", "", ""]], "fingerprint": "692ef7e9fb48"};
const COLS = DATA.columns, KINDS = DATA.kinds, SAME = DATA.same;
const ROWS = DATA.rows.map(r => Object.fromEntries(COLS.map((c, i) => [c, r[i]])));
const STORE = "reflection-judge:" + DATA.fingerprint;

let state = {marks: {}, judge: ""};
try { state = Object.assign(state, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
function mark(qid) {
  return state.marks[qid] || (state.marks[qid] = {A: KINDS.map(() => false), B: KINDS.map(() => false), note: "", done: false});
}

let current = 0;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function render(text) {
  let html = esc(text);
  html = html.replace(/!\[([^\]\n]*)\]\((images\/[\w.\-]+)\)/g, '<img alt="$1" src="$2">');
  html = html.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  // 線段（邊長）：A̅B̅ → AB 上面一條連續的線（跟聊天室的顯示一樣）
  return html.replace(/(?:[A-Za-z]̅)+/g, run => '<span class="seg">' + run.replace(/̅/g, "") + "</span>");
}

function replyBox(side, row, m) {
  const text = row["回覆" + side];
  const same = side === "B" && text === SAME;
  const flagged = !same && m[side].some(Boolean);
  const checks = same ? "" : '<div class="checks">' + KINDS.map((k, i) =>
    `<label><input type="checkbox" data-side="${side}" data-i="${i}" ${m[side][i] ? "checked" : ""}> ${k}</label>`).join("") +
    '</div><div class="none">都沒有問題就不用勾</div>';
  return `<section class="reply ${flagged ? "flagged" : ""}"><h2>回覆${side}</h2>
    <div class="body ${same ? "same" : ""}">${same ? "與回覆 A 完全相同，只要判讀回覆 A。" : render(text)}</div>${checks}</section>`;
}

function show(i) {
  current = Math.max(0, Math.min(ROWS.length - 1, i));
  const row = ROWS[current], m = mark(row["題號"]);
  const history = row["先前對話"] ? `<div class="box"><div class="label">先前對話</div><div class="text">${esc(row["先前對話"])}</div></div>` : "";
  $("card").innerHTML = `
    <div class="meta"><span class="tag">${esc(row["題號"])}</span><strong>${esc(row["類型"])}</strong>
      <span class="done-tag">${m.done ? "✓ 已判讀" : ""}</span></div>
    <div class="box hint"><div class="label">判讀提示（正確答案與注意事項）</div><div class="text">${esc(row["判讀提示"])}</div></div>
    ${history}
    <div class="box"><div class="label">學生這句</div><div class="text">${esc(row["學生這句"])}</div></div>
    <div class="cols">${replyBox("A", row, m)}${replyBox("B", row, m)}</div>
    <div class="box" style="margin-top:12px"><div class="label">備註（選填）</div><textarea id="note">${esc(m.note)}</textarea></div>
    <div class="nav"><button id="prev" ${current === 0 ? "disabled" : ""}>‹ 上一題</button>
      <button class="primary" id="next">${current === ROWS.length - 1 ? "完成這題" : "完成，下一題 ›"}</button>
      <span class="grow"></span><span id="msg"></span></div>`;
  $("card").querySelectorAll("input[type=checkbox]").forEach(box => box.addEventListener("change", () => {
    m[box.dataset.side][+box.dataset.i] = box.checked;
    save();
    box.closest(".reply").classList.toggle("flagged", m[box.dataset.side].some(Boolean));
  }));
  $("note").addEventListener("input", e => { m.note = e.target.value; save(); });
  $("prev").addEventListener("click", () => show(current - 1));
  $("next").addEventListener("click", () => { m.done = true; save(); refreshHeader(); show(current + 1); });
  refreshHeader();
  window.scrollTo(0, 0);
}

function refreshHeader() {
  const done = ROWS.filter(r => mark(r["題號"]).done).length;
  $("progress").textContent = `第 ${current + 1} / ${ROWS.length} 題・已判讀 ${done} 題`;
  $("jump").innerHTML = ROWS.map((r, i) => `<option value="${i}" ${i === current ? "selected" : ""}>${mark(r["題號"]).done ? "✓ " : ""}${r["題號"]} ${r["類型"]}</option>`).join("");
}

function csvCell(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
function buildCsv() {
  const lines = [COLS.map(csvCell).join(",")];
  for (const row of ROWS) {
    const m = mark(row["題號"]);
    const cells = COLS.map(c => {
      for (const side of ["A", "B"]) {
        const i = KINDS.map(k => side + k).indexOf(c);
        if (i >= 0) return m[side][i] ? "1" : "";
      }
      return c === "備註" ? m.note : row[c];
    });
    lines.push(cells.map(csvCell).join(","));
  }
  return lines.join("\r\n");
}
function exportCsv() {
  const left = ROWS.filter(r => !mark(r["題號"]).done).length;
  const name = ($("judge").value || "").trim();
  const blob = new Blob(["﻿" + buildCsv()], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name ? `judge_sheet_${name}.csv` : "judge_sheet_filled.csv";
  document.body.appendChild(a); a.click(); a.remove();
  $("msg").textContent = left ? `已匯出，但還有 ${left} 題沒按「完成」（會當成沒問題計算）` : "已匯出，檔案在瀏覽器的下載資料夾";
}

$("jump").addEventListener("change", e => show(+e.target.value));
$("export").addEventListener("click", exportCsv);
$("judge").value = state.judge || "";
$("judge").addEventListener("input", e => { state.judge = e.target.value; save(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT" && e.target.type === "text") return;
  if (e.key === "ArrowLeft") show(current - 1);
  if (e.key === "ArrowRight") show(current + 1);
});
show(0);
</script>
</body>
</html>
